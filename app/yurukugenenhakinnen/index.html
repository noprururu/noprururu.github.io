<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゆる～く減煙は禁煙</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --surface-sub: #262626;
    --border: #333333;
    --text: #f0f0f0;
    --muted: #888888;
    --plus: #2e7d32;
    --minus: #c62828;
    --active: #4caf50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; }

  /* 最上部：1か月分の日付バー */
  .days-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .day-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 7px;
    border-radius: 5px;
    font-size: 0.75rem;
    cursor: pointer;
    min-width: 44px;
    text-align: center;
  }
  .day-btn.active {
    background: var(--active);
    border-color: var(--active);
    color: #fff;
    font-weight: bold;
  }
  .day-btn.has-data { border-bottom: 2px solid var(--active); }

  /* メイン3カラム：左(縦1列24時間) / 中央(大表示) / 右(ダークグラフ) */
  .main-grid {
    display: grid;
    grid-template-columns: 260px 300px 1fr;
    gap: 20px;
    align-items: start;
  }

  /* 左：縦1列の0〜23時リスト（スクロール不要のコンパクト設計） */
  .hours-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .hour-row {
    display: grid;
    grid-template-columns: 44px 1fr 1fr 44px;
    align-items: center;
    padding: 2px 6px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    height: 25px;
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-row.current {
    background: rgba(76, 175, 80, 0.18);
    border-left: 3px solid var(--active);
  }
  .row-time { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hour-row.current .row-time { color: var(--text); font-weight: bold; }
  .row-count { font-size: 0.88rem; font-weight: bold; font-variant-numeric: tabular-nums; }
  .row-count.zero { color: var(--muted); font-weight: normal; }
  .row-btn {
    width: 34px;
    height: 20px;
    margin: 0 auto;
    border: 1px solid var(--border);
    background: var(--surface-sub);
    color: var(--text);
    border-radius: 4px;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
  }
  .row-btn.m:hover { background: var(--minus); border-color: var(--minus); }
  .row-btn.p:hover { background: var(--plus); border-color: var(--plus); }

  /* 中央：大きい時間と本数・ボタン */
  .hero-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
  }
  .hero-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .hero-time {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--active);
    margin-bottom: 12px;
  }
  .hero-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }
  .hero-count { font-size: 4rem; font-weight: 800; min-width: 75px; }
  .hero-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    color: #fff;
    font-size: 1.8rem;
    font-weight: bold;
    cursor: pointer;
  }
  .hero-btn.m { background: var(--minus); }
  .hero-btn.p { background: var(--plus); }
  .hint { margin-top: 14px; font-size: 0.7rem; color: var(--muted); }

  /* 右側：1日のダークグラフ */
  .chart-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .chart-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .chart-area {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 210px;
    padding-top: 20px;
    border-bottom: 1px solid var(--border);
  }
  .bar-col {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
  }
  .bar-val { font-size: 0.65rem; color: var(--text); margin-bottom: 3px; min-height: 12px; }
  .bar-fill {
    width: 100%;
    max-width: 14px;
    background: #388e3c;
    border-radius: 3px 3px 0 0;
    transition: height 0.25s ease;
    min-height: 2px;
  }
  .bar-fill.zero { background: #2a2a2a; }
  .bar-fill.current { background: #66bb6a; box-shadow: 0 0 8px rgba(102, 187, 106, 0.4); }
  .bar-label { font-size: 0.65rem; color: var(--muted); margin-top: 6px; }

  /* 最下部：12か月タブ */
  .month-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .month-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .month-btn.active {
    background: var(--active);
    color: #fff;
    border-color: var(--active);
    font-weight: bold;
  }

  @media (max-width: 1024px) {
    .main-grid { grid-template-columns: 1fr; }
    .hero-box { order: -1; }
  }
</style>

<!-- PC -->
<link rel="icon" href="favicon.ico" type="image/x-icon">

<!-- Smart Phone -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NW2NR5J4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>

</head>
<body>

<div class="wrap">
  <div class="days-bar" id="days-bar"></div>

  <div class="main-grid">
    <!-- 左：縦1列の0〜23時リスト -->
    <div class="hours-list" id="hours-list"></div>

    <!-- 中央：大きい時間とボタン -->
    <div class="hero-box">
      <div class="hero-meta">
        <span id="selected-date-label">----/--/--</span>
        <span>合計: <strong id="total-count">0</strong> 本</span>
      </div>
      <div class="hero-time" id="hero-time">00時台</div>
      <div class="hero-controls">
        <button class="hero-btn m" id="hero-minus">−</button>
        <div class="hero-count" id="hero-count">0</div>
        <button class="hero-btn p" id="hero-plus">＋</button>
      </div>
      <div class="hint">[Enter / Space / → / +] 増加　[← / -] 減少</div>
    </div>

    <!-- 右：1日のダークグラフ -->
    <div class="chart-box">
      <div class="chart-header">
        <span>時間帯別グラフ (0時〜23時)</span>
        <span id="chart-peak">記録なし</span>
      </div>
      <div class="chart-area" id="chart-area"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="month-bar" id="month-bar"></div>
</div>
<script>
  const now = new Date();
  let selectedYear = now.getFullYear();
  let selectedMonth = now.getMonth();
  let selectedDay = now.getDate();

  function getDateKey(y, m, d) {
    return `smoke_log_${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  function loadData(y, m, d) {
    const saved = localStorage.getItem(getDateKey(y, m, d));
    return saved ? JSON.parse(saved).slice(0, 24) : new Array(24).fill(0);
  }

  function saveData(y, m, d, data) {
    localStorage.setItem(getDateKey(y, m, d), JSON.stringify(data));
  }

  function render() {
    const currentNow = new Date();
    const currentHour = currentNow.getHours();
    const isToday = (
      selectedYear === currentNow.getFullYear() &&
      selectedMonth === currentNow.getMonth() &&
      selectedDay === currentNow.getDate()
    );
    const counts = loadData(selectedYear, selectedMonth, selectedDay);

    const daysBar = document.getElementById('days-bar');
    daysBar.innerHTML = '';
    const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();
    const weekNames = ['日', '月', '火', '水', '木', '金', '土'];

    for (let d = 1; d <= daysInMonth; d++) {
      const w = weekNames[new Date(selectedYear, selectedMonth, d).getDay()];
      const hasData = loadData(selectedYear, selectedMonth, d).some(v => v > 0);
      const btn = document.createElement('button');
      btn.className = 'day-btn' + (d === selectedDay ? ' active' : '') + (hasData ? ' has-data' : '');
      btn.textContent = `${d}(${w})`;
      btn.onclick = () => { selectedDay = d; render(); };
      daysBar.appendChild(btn);
    }

    document.getElementById('selected-date-label').textContent = `${selectedYear}年${selectedMonth + 1}月${selectedDay}日`;
    document.getElementById('hero-time').textContent = `${String(currentHour).padStart(2, '0')}時台`;
    document.getElementById('hero-count').textContent = counts[currentHour];
    document.getElementById('total-count').textContent = counts.reduce((a, b) => a + b, 0);

    const list = document.getElementById('hours-list');
    list.innerHTML = '';
    for (let h = 0; h < 24; h++) {
      const row = document.createElement('div');
      row.className = 'hour-row' + (isToday && h === currentHour ? ' current' : '');
      const val = counts[h];
      row.innerHTML = `
        <button class="row-btn m" data-h="${h}">−</button>
        <div class="row-time">${String(h).padStart(2, '0')}:00</div>
        <div class="row-count ${val === 0 ? 'zero' : ''}">${val}</div>
        <button class="row-btn p" data-h="${h}">＋</button>
      `;
      list.appendChild(row);
    }

    const chartArea = document.getElementById('chart-area');
    chartArea.innerHTML = '';
    const maxVal = Math.max(...counts, 1);
    const peakVal = Math.max(...counts);
    document.getElementById('chart-peak').textContent = peakVal > 0 ? `最大: ${peakVal}本/時` : '記録なし';

    for (let h = 0; h < 24; h++) {
      const val = counts[h];
      const heightPct = val === 0 ? 2 : Math.round((val / maxVal) * 100);
      const col = document.createElement('div');
      col.className = 'bar-col';
      col.title = `${h}時台: ${val}本`;
      col.innerHTML = `
        <div class="bar-val">${val > 0 ? val : ''}</div>
        <div class="bar-fill ${val === 0 ? 'zero' : ''} ${isToday && h === currentHour ? 'current' : ''}" style="height: ${heightPct}%;"></div>
        <div class="bar-label">${h % 3 === 0 ? h : ''}</div>
      `;
      chartArea.appendChild(col);
    }

    const monthBar = document.getElementById('month-bar');
    monthBar.innerHTML = '';
    for (let i = 0; i < 12; i++) {
      const d = new Date(currentNow.getFullYear(), currentNow.getMonth() + i, 1);
      const y = d.getFullYear();
      const m = d.getMonth();
      const btn = document.createElement('button');
      btn.className = 'month-btn' + (y === selectedYear && m === selectedMonth ? ' active' : '');
      btn.textContent = `${y}/${m + 1}月`;
      btn.onclick = () => {
        selectedYear = y;
        selectedMonth = m;
        const maxDay = new Date(y, m + 1, 0).getDate();
        if (selectedDay > maxDay) selectedDay = maxDay;
        render();
      };
      monthBar.appendChild(btn);
    }
  }

  function updateCount(hour, delta) {
    const counts = loadData(selectedYear, selectedMonth, selectedDay);
    if (counts[hour] + delta < 0) return;
    counts[hour] += delta;
    saveData(selectedYear, selectedMonth, selectedDay, counts);
    render();
  }

  document.getElementById('hero-minus').onclick = () => updateCount(new Date().getHours(), -1);
  document.getElementById('hero-plus').onclick = () => updateCount(new Date().getHours(), 1);
  document.getElementById('hours-list').onclick = (e) => {
    const btn = e.target.closest('.row-btn');
    if (btn) updateCount(Number(btn.dataset.h), btn.classList.contains('m') ? -1 : 1);
  };

  document.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    const h = new Date().getHours();
    if (['Enter', ' ', 'ArrowRight', '+', '='].includes(e.key)) { e.preventDefault(); updateCount(h, 1); }
    else if (['ArrowLeft', '-', '_'].includes(e.key)) { e.preventDefault(); updateCount(h, -1); }
  });

  setInterval(render, 30000);
  render();
</script>
</body>
</html>
